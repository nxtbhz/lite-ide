[workspace]
members = [
    "crates/lume-core",
    "crates/lume-syntax",
    "crates/lume-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Lume Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/lume-ide/lume"

[workspace.dependencies]
ropey = "1.6"
crossbeam-channel = "0.5"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
criterion = "0.5"
